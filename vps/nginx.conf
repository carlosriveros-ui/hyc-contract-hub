server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://hermes-agent:3000/health;
    }

    location /webhook/ {
        proxy_pass http://hermes-agent:3000/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /agent/ {
        proxy_pass http://hermes-agent:3000/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
